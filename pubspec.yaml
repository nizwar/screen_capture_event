name: screen_capture_event
description: Catch screenshot and screen recording events on Android and iOS, using the system callbacks on Android 14 and 15 and later.
version: 1.3.0
homepage: https://github.com/nizwar/screen_capture_event
repository: https://github.com/nizwar/screen_capture_event
issue_tracker: https://github.com/nizwar/screen_capture_event/issues
topics:
  - screenshot
  - screen-recording
  - security
  - privacy

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies: 
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: id.nizwar.screen_capture_event
        pluginClass: ScreenCaptureEventPlugin
      ios:
        pluginClass: ScreenCaptureEventPlugin
